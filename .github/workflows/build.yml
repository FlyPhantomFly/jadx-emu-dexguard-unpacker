name: build

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: ./gradlew --no-daemon test jar
      - uses: actions/upload-artifact@v4
        with:
          name: dexguard-unpacker
          path: build/libs/*.jar
